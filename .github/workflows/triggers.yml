# Secondary triggers. GitHub schedules can be late or skipped and are auto-disabled after 60 idle days,
# so these only ever back up the Vercel crons. Every call is idempotent (same ISO week => same job).
name: backup-triggers
on:
  schedule:
    - cron: "17 0 * * 1"   # Mon 00:17 UTC (05:47 IST)
    - cron: "47 1 * * 1"   # Mon 01:47 UTC (07:17 IST)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call weekly route
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" -H "x-trigger-source: github" \
            --max-time 290 "${APP_URL}/api/cron/weekly")
          echo "status=$code"; head -c 400 /tmp/out.json || true
          test "$code" = "200"
